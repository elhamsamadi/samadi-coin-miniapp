
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samadi Coin</title>
<style>
*{box-sizing:border-box}
body{
margin:0;min-height:100vh;padding:25px 18px;
background:linear-gradient(160deg,#07152f,#102d55);
color:white;font-family:Arial,sans-serif;text-align:center
}
.logo{
width:180px;height:180px;object-fit:contain;
margin:20px auto 10px;display:block;
filter:drop-shadow(0 0 15px #dca83b)
}
h1{color:#ffd66b;margin:10px}
.subtitle{color:#c6d7ed}
.balance{
background:#183b65;border-radius:18px;
padding:22px;margin:28px auto;max-width:350px
}
.points{font-size:36px;color:#ffd66b;font-weight:bold}
button{
border:0;border-radius:14px;padding:17px 45px;
font-size:20px;font-weight:bold;
background:linear-gradient(90deg,#f7c85c,#e99a24);
color:#102448
}
.note{color:#b8c9df;font-size:13px}
</style>
</head>
<body>

<img class="logo"
src="Samadi%20Coin%3A%20Mine%2C%20Earn%2C%20Grow.png"
alt="Samadi Coin Logo">

<h1>Samadi Coin</h1>
<p class="subtitle">Mine • Earn • Grow</p>

<div class="balance">
<p>Your Balance</p>
<div class="points" id="balance">0</div>
<p>Virtual Points</p>
</div>

<button onclick="startMining()">⚡ MINE</button>
<p id="status">Press Mine to start your session</p>
<p class="note">Mining sessions are planned for 24 hours.</p>

<script>
function startMining(){
document.getElementById("status").textContent=
"Mining demo button is working!";
}
</script>

</body>
</html>
