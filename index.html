
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samadi Coin</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(160deg, #07152f, #102d55);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px 20px;
    }
    .coin {
      width: 115px;
      height: 115px;
      margin: 35px auto 20px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ffe18a, #bd8120);
      color: #102448;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 58px;
      font-weight: bold;
      box-shadow: 0 0 30px #dca83b;
      border: 5px solid #fff0b5;
    }
    h1 { color: #ffd66b; }
    .balance {
      background: #183b65;
      border-radius: 16px;
      padding: 20px;
      margin: 25px auto;
      max-width: 350px;
    }
    .points {
      font-size: 32px;
      color: #ffd66b;
      font-weight: bold;
    }
    button {
      border: 0;
      border-radius: 14px;
      padding: 16px 35px;
      font-size: 20px;
      font-weight: bold;
      background: linear-gradient(90deg, #f7c85c, #e99a24);
      color: #102448;
      cursor: pointer;
    }
    .note { color: #b8c9df; font-size: 13px; }
  </style>
</head>
<body>
  <div class="coin">S</div>
  <h1>Samadi Coin</h1>
  <p>Mine • Earn • Grow</p>

  <div class="balance">
    <p>Your Balance</p>
    <div class="points" id="balance">0</div>
    <p>Virtual Points</p>
  </div>

  <button onclick="startMining()">⚡ MINE</button>
  <p id="status">Press Mine to start your session</p>
  <p class="note">Mining sessions are planned for 24 hours.</p>

  <script>
    function startMining() {
      document.getElementById("status").textContent =
        "Mining demo button is working!";
    }
  </script>
</body>
</html>
