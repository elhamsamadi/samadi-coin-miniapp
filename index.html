
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samadi Coin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body {
  margin: 0;
  background: #071426;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 25px 15px;
}
.logo {
  width: 190px;
  max-width: 75%;
  margin: 25px auto;
}
h1 { color: #f4c75e; }
.balance {
  font-size: 34px;
  color: #f4c75e;
  margin: 25px;
}
button {
  background: linear-gradient(135deg,#f6d36b,#b77a18);
  color: #071426;
  border: 0;
  border-radius: 14px;
  padding: 17px 55px;
  font-size: 22px;
  font-weight: bold;
}
button:disabled { opacity: .5; }
#status { margin: 20px; color: #b9d5f4; }
</style>
</head>
<body>

<img class="logo"
src="./Samadi%20Coin%3A%20Mine%2C%20Earn%2C%20Grow.png"
alt="Samadi Coin">

<h1>Samadi Coin</h1>
<p>Mine • Earn • Grow</p>

<div class="balance" id="balance">0</div>
<p>YOUR BALANCE</p>

<button id="mine">MINE</button>
<p id="status">Connecting...</p>
<p id="timer"></p>

<script>
const API_URL =
"https://gbcdoerqhhfinmojqumk.supabase.co/functions/v1/samadi-mine";

const SUPABASE_KEY = "sb_publishable_DMCqdVDC4viNjTQi8tiXHA_rB60p1Jf";

const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const balanceEl = document.getElementById("balance");
const statusEl = document.getElementById("status");
const timerEl = document.getElementById("timer");
const mineBtn = document.getElementById("mine");

let endTime = null;

async function request(action) {
  const initData = tg.initData;

  if (!initData) {
    statusEl.textContent = "Please open Samadi Coin inside Telegram.";
    return;
  }

  mineBtn.disabled = true;
  statusEl.textContent = "Loading...";

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY
      },
      body: JSON.stringify({
        initData: initData,
        action: action
      })
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.error || "Request failed");
    }

    const data = result.user;
    balanceEl.textContent = data.balance ?? 0;
    endTime = data.ends_at ? new Date(data.ends_at) : null;

    if (data.status === "started") {
      statusEl.textContent = "Mining started! 24 hours.";
    } else if (data.status === "active") {
      statusEl.textContent = "Mining is active.";
    } else {
      statusEl.textContent = "Mining is inactive. Tap MINE to start.";
    }

    updateTimer();

  } catch (error) {
    statusEl.textContent = "Connection error. Please try again.";
  } finally {
    mineBtn.disabled = false;
  }
}

function updateTimer() {
  if (!endTime) {
    timerEl.textContent = "";
    return;
  }

  const remaining = Math.max(0, endTime - new Date());

  if (remaining === 0) {
    timerEl.textContent = "Mining session completed.";
    return;
  }

  const hours = Math.floor(remaining / 3600000);
  const minutes = Math.floor((remaining % 3600000) / 60000);

  timerEl.textContent = `Time remaining: ${hours}h ${minutes}m`;
}

mineBtn.addEventListener("click", () => request("start"));

request("status");
setInterval(updateTimer, 30000);
</script>

</body>
</html>
